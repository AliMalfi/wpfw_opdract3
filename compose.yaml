services:
  # 1. Database: bestaande SQL Server-image met een benoemd volume
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Vul MSSQL_SA_PASSWORD in .env in}
    volumes:
      - portfolio-data:/var/opt/mssql
    ports:
      - "127.0.0.1:14330:1433"   # alleen voor SSMS op je laptop
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 2. API: eigen image, vindt de database via de servicenaam "db"
  api:
    build:
      context: .
      dockerfile: wpfw_opdract3/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: >-
        Server=db,1433;Database=PortfolioDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
    depends_on:
      db:
        condition: service_healthy

  # 3. Web: Nginx met de React-build, de enige poort voor de browser
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  portfolio-data: